<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Секретный подарок жене</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root {
            --color-primary: {{ theme_payload.primary_color }};
            --color-secondary: {{ theme_payload.secondary_color }};
            --color-accent: {{ theme_payload.accent_color }};
            --color-bg: {{ theme_payload.light_bg }};
            --font-display: '{{ theme_payload.display_font }}', {{ theme_payload.display_font_fallback }};
            --font-body: '{{ theme_payload.body_font }}', {{ theme_payload.body_font_fallback }};
        }

        [data-theme="dark"] {
            --color-bg: {{ theme_payload.dark_bg }};
        }

        .secret-shell {
            min-height: 100vh;
            background: linear-gradient(180deg, var(--color-bg) 0%, var(--color-accent) 100%);
            padding: 40px 0 60px;
        }

        .secret-card {
            max-width: 900px;
            margin: 0 auto;
            background: var(--color-bg-alt);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 26px;
        }

        .secret-title {
            text-align: center;
            margin-bottom: 18px;
        }

        .secret-placeholder {
            text-align: center;
            color: var(--color-text-muted);
            font-size: 1.2rem;
            padding: 64px 16px;
            border: 1px dashed var(--color-border);
            border-radius: var(--radius-md);
            background: var(--color-bg);
        }

        .secret-video {
            width: 100%;
            max-height: 75vh;
            border-radius: var(--radius-md);
            border: 1px solid var(--color-border);
            background: #000;
        }
    </style>
</head>
<body>
    <section class="secret-shell">
        <div class="container">
            <div class="form-actions" style="margin-top:0; margin-bottom:14px;">
                <a href="/" class="btn btn-outline">На главную</a>
            </div>
            <div class="secret-card">
                <h1 class="section-title secret-title">Секретный подарок жене</h1>
                {% if secret_video.has_video %}
                <video class="secret-video" controls preload="metadata">
                    <source src="{{ secret_video.url }}" type="video/mp4">
                    Ваш браузер не поддерживает видео.
                </video>
                {% else %}
                <div class="secret-placeholder">Подарок скрыт</div>
                {% endif %}
            </div>
        </div>
    </section>
</body>
</html>
